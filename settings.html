<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyBiblio — Paramètres</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="settings">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span> MyBiblio
      </a>
      <nav aria-label="Navigation principale">
        <a href="index.html" data-nav="search">Rechercher</a>
        <a href="add.html" data-nav="add">Ajouter un livre</a>
        <a href="shelves.html" data-nav="shelves">Mes étagères</a>
        <a href="acheter.html" data-nav="buy">À acheter</a>
        <a href="settings.html" data-nav="settings">Paramètres</a>
      </nav>
    </div>
  </header>

  <main class="container narrow main-content">
    <section class="page-intro">
      <h1>Paramètres</h1>
      <p>Gérez vos étagères et vos préférences.</p>
    </section>

    <section aria-labelledby="shelves-title">
      <div class="section-heading">
        <div>
          <h2 id="shelves-title">Mes étagères</h2>
          <p class="muted">Créez et personnalisez vos étagères pour organiser votre collection.</p>
        </div>
      </div>

      <div class="settings-card">
        <form id="shelf-form" class="form-card">
          <div class="field">
            <label for="shelf-name">Nom de l'étagère</label>
            <input id="shelf-name" name="name" type="text" placeholder="Ex. Science-Fiction" required maxlength="60">
          </div>
          <div class="field">
            <label for="shelf-color">Couleur</label>
            <input id="shelf-color" name="color" type="color" value="#195c4a">
          </div>
          <button type="submit" class="button-primary">Ajouter une étagère</button>
          <p id="shelf-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>

      <ul id="shelf-list" class="settings-list"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
