<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyBiblio — À acheter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="buy">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span> MyBiblio
      </a>
      <nav aria-label="Navigation principale">
        <a href="index.html" data-nav="search">Rechercher</a>
        <a href="add.html" data-nav="add">Ajouter un livre</a>
        <a href="shelves.html" data-nav="shelves">Mes étagères</a>
        <a href="acheter.html" data-nav="buy">À acheter</a>
        <a href="settings.html" data-nav="settings">Paramètres</a>
      </nav>
    </div>
  </header>

  <main class="container narrow purchase-page main-content">
    <a class="back-link" href="index.html">← Retour à la bibliothèque</a>
    <section class="page-intro">
      <p class="eyebrow">VOTRE LISTE</p>
      <h1>À acheter</h1>
      <p class="intro">Gardez sous la main les livres que vous aimeriez ajouter à votre bibliothèque.</p>
    </section>

    <form id="purchase-form" class="purchase-form">
      <div class="field">
        <label for="purchase-title">Nom du livre</label>
        <input id="purchase-title" name="title" required maxlength="160" placeholder="Ex. Une chambre à soi">
      </div>
      <div class="field">
        <label for="purchase-author">Auteur</label>
        <input id="purchase-author" name="author" maxlength="120" placeholder="Ex. Virginia Woolf">
      </div>
      <div class="field">
        <label for="purchase-comment">Commentaire</label>
        <input id="purchase-comment" name="comment" maxlength="300" placeholder="Pourquoi souhaitez-vous le lire ?">
      </div>
      <button class="button-primary" type="submit">Ajouter</button>
      <p id="purchase-message" class="form-message" role="status" aria-live="polite"></p>
    </form>

    <section aria-labelledby="purchase-list-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">VOS ENVIES DE LECTURE</p>
          <h2 id="purchase-list-title">Livres à acheter</h2>
        </div>
        <span id="purchase-count" class="count-pill">0</span>
      </div>
      <div class="purchase-table-wrap">
        <table class="purchase-table">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Auteur</th>
              <th>Commentaire</th>
              <th aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody id="purchase-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
