<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyBiblio — Ajouter un livre</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand"><a href="index.html">MyBiblio</a></h1>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="index.html" class="nav-link">Recherche</a>
        <a href="add.html" class="nav-link active">Ajouter un livre</a>
        <a href="shelves.html" class="nav-link">Par étagère</a>
        <a href="settings.html" class="nav-link">Paramètres</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section aria-labelledby="add-book-title" class="card">
      <h2 id="add-book-title">Ajouter un livre</h2>
      <form id="addBookForm">
        <label for="isbn">ISBN (optionnel)</label>
        <div class="isbn-row">
          <input id="isbn" name="isbn" placeholder="Ex: 9780140449136">
          <button type="button" id="fetchIsbn" class="secondary">Chercher par ISBN</button>
          <button type="button" id="scanBtn" class="secondary">Scanner (caméra)</button>
        </div>

        <div id="scannerContainer" class="hidden scanner">
          <video id="scannerVideo" autoplay muted playsinline></video>
          <div class="inline-controls">
            <button type="button" id="stopScan" class="secondary">Arrêter le scan</button>
          </div>
        </div>

        <label for="title">Titre</label>
        <input id="title" name="title" required>

        <label for="author">Auteur</label>
        <input id="author" name="author">

        <label for="shelfSelect">Étagère</label>
        <select id="shelfSelect" name="shelfId" required aria-required="true">
          <option value="" selected disabled>Choisir une étagère</option>
        </select>

        <div class="inline-controls">
          <button type="button" id="createShelfBtn" class="secondary">Créer une nouvelle étagère</button>
        </div>

        <div id="newShelfContainer" class="hidden new-shelf">
          <label for="newShelfName">Nom de la nouvelle étagère</label>
          <input id="newShelfName" placeholder="Ex: Football" aria-label="Nom de la nouvelle étagère">
          <div class="inline-controls">
            <button type="button" id="addNewShelf">Ajouter étagère</button>
            <button type="button" id="cancelNewShelf" class="secondary">Annuler</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Enregistrer</button>
        </div>
      </form>
    </section>

    <section class="card small-card">
      <h3>Stockage local</h3>
      <div>
        <p>Les actions de gestion du stockage se trouvent désormais dans la page <a href="settings.html">Paramètres</a>.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container">Stockage: localStorage — les données sont locales à ce navigateur/appareil.</div></footer>
  <script type="module" src="add.js"></script>
</body>
</html>
