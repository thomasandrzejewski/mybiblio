<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyBiblio — Ajouter un livre</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="add">
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">M</span> MyBiblio</a><nav aria-label="Navigation principale"><a data-nav="search" href="index.html">Rechercher</a><a data-nav="add" href="add.html">Ajouter un livre</a><a data-nav="shelves" href="shelves.html">Mes étagères</a><a data-nav="buy" href="acheter.html">À acheter</a><a data-nav="settings" href="settings.html">Paramètres</a></nav></div></header>
<main class="container narrow main-content"><a class="back-link" href="index.html">← Retour à la bibliothèque</a><section class="page-intro"><p class="eyebrow">VOTRE COLLECTION</p><h1>Ajouter un livre</h1><p>Ajoutez les informations de votre livre et sa couverture.</p></section>
<form id="add-book-form" class="book-form"><div class="field"><label for="book-title">Titre</label><input id="book-title" name="title" required maxlength="160" placeholder="Ex. Une chambre à soi"></div><div class="field"><label for="book-author">Auteur</label><input id="book-author" name="author" maxlength="120" placeholder="Ex. Virginia Woolf"></div><div class="field"><label for="book-status">Statut</label><select id="book-status" name="status"><option value="to-read">À lire</option><option value="reading">En cours</option><option value="read">Lu</option></select></div><div class="field"><label for="book-shelf">Étagère</label><select id="book-shelf" name="shelf"></select></div><div class="field"><label for="book-cover">Couverture <span class="muted">(facultatif)</span></label><input id="book-cover" name="cover" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG ou WebP · 5 Mo maximum</small><img id="cover-preview" alt="Aperçu de la couverture" hidden style="display:block;max-width:140px;max-height:200px;margin-top:12px;border-radius:8px;object-fit:cover"></div><button class="button-primary" type="submit">Ajouter le livre</button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form></main><footer class="site-footer"><div class="container">MyBiblio · Vos données restent dans votre navigateur.</div></footer><script type="module" src="app.js"></script>
</body></html>
