<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyBiblio — Ma bibliothèque</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>MyBiblio</h1>
    <p>Gérez vos livres et vos étagères (stockage local)</p>
  </header>

  <main>
    <section aria-labelledby="add-book-title" class="card">
      <h2 id="add-book-title">Ajouter un livre</h2>
      <form id="addBookForm">
        <label for="title">Titre</label>
        <input id="title" name="title" required>

        <label for="author">Auteur</label>
        <input id="author" name="author">

        <label for="shelfSelect">Étagère</label>
        <select id="shelfSelect" name="shelfId">
          <option value="" selected disabled>Choisir une étagère</option>
        </select>

        <div class="inline-controls">
          <button type="button" id="createShelfBtn">Créer une nouvelle étagère</button>
        </div>

        <div id="newShelfContainer" class="hidden">
          <label for="newShelfName">Nom de la nouvelle étagère</label>
          <input id="newShelfName" placeholder="Ex: Football" aria-label="Nom de la nouvelle étagère">
          <div class="inline-controls">
            <button type="button" id="addNewShelf">Ajouter étagère</button>
            <button type="button" id="cancelNewShelf">Annuler</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Enregistrer</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="library-title" class="card">
      <h2 id="library-title">Ma bibliothèque</h2>
      <div class="controls">
        <button id="exportBtn">Exporter (JSON)</button>
        <label class="import-label">Importer
          <input type="file" id="importFile" accept="application/json">
        </label>
        <button id="clearBtn">Vider le stockage local</button>
      </div>
      <div id="booksList" class="list" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <small>Stockage: localStorage — les données sont locales à ce navigateur/appareil.</small>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
